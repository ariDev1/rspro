name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bluez
          python -m pip install --requirement requirements-dev.txt
      - name: Bash syntax
        run: bash -n rspro install_rspro_cli.sh
      - name: Python syntax
        run: python -m compileall -q rspro_*.py tests tools
      - name: Functional Python lint
        run: python -m ruff check .
      - name: Unit and isolated installer tests
        run: python -m unittest discover -s tests -v
